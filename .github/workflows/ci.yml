name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false
          rustflags: ''
          build-warnings: ''
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-make@0.37.24,cargo-nextest@0.9.152
      - name: Install the repository lint tool
        # Build v0.2.9 from the pinned release commit.
        run: cargo install --locked --git https://github.com/acg-box/vibe-style --rev dea96c3de39354f1b42da1a52a37812e525c6f52 vibe-style
      - name: Check and build without release credentials
        run: |
          npm ci --ignore-scripts
          cargo make check
          cargo make build
