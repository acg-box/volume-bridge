name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          rustflags: ''
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-make@0.37.24,cargo-nextest@0.9.143
      - name: Install the repository lint tool
        # v0.2.5 needs Git metadata that its crates.io archive does not contain.
        run: cargo install --locked --git https://github.com/acg-box/vibe-style --rev 3f39ce57b54def2cdd95a330faae299f5eb55014 vibe-style
      - name: Check and build without release credentials
        run: |
          npm ci --ignore-scripts
          cargo make check
          cargo make build
