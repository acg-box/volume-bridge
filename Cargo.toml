[workspace]
members  = ["apps/*"]
resolver = "3"

[workspace.package]
authors     = ["acgxv <xv@acg.box>"]
description = "Native macOS volume control through a HAL driver and headless service."
edition     = "2024"
homepage    = "https://github.com/acg-box/volume-bridge"
license     = "GPL-3.0-only"
repository  = "https://github.com/acg-box/volume-bridge"
version     = "0.2.2"

[workspace.dependencies]
serde      = { version = "~1.0", features = ["derive"] }
serde_json = { version = "~1.0" }

[profile.release]
lto = "thin"
